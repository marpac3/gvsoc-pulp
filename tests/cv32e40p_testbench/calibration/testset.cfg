import os
import re
from gvtest.testsuite import *

# Timing calibration of the CV32E40P model (README.md). Each program times instruction
# blocks with mcycle and the HPM counters and prints one line per block; refs/ holds the
# lines printed by the same binary on the RTL, in the core-v-verif UVM testbench without
# bus stalls. Every line is a bench that must match exactly.

CONFIGS = {
    'default'       : 'cv32e40p_testbench',
    'pulp'          : 'cv32e40p_testbench:config.soc/corev_pulp=true:config.soc/fpu=true',
    'pulp_fpu'      : 'cv32e40p_testbench:config.soc/corev_pulp=true:config.soc/fpu=true',
    'pulp_fpu_zfinx': 'cv32e40p_testbench:config.soc/corev_pulp=true'
                      ':config.soc/corev_cluster=true:config.soc/fpu=true'
                      ':config.soc/zfinx=true',
}

# RTL FPU_ADDMUL_LAT and FPU_OTHERS_LAT of the *_1cyclat and *_2cyclat configurations.
LATENCIES = {
    '1cyclat': ':config.soc/fpu_addmul_lat=1:config.soc/fpu_others_lat=1',
    '2cyclat': ':config.soc/fpu_addmul_lat=2:config.soc/fpu_others_lat=2',
}

LINE = re.compile(r'^(CALIB (\S+) cycles=(\d+) iters=\d+|CALIB_HPM (\S+) event=(0x[0-9a-f]+) '
                  r'count=(\d+)|CALIB_READ (\S+) value=(\d+))$')


def target(config):
    base, _, latency = config.rpartition('_')
    if latency in LATENCIES:
        return CONFIGS[base] + LATENCIES[latency]
    return CONFIGS[config]


def add_benches(test, name, ref_path):
    for line in open(ref_path):
        m = LINE.match(line.strip())
        if m.group(2) is not None:
            block, value = m.group(2), m.group(3)
            extract = rf'CALIB {re.escape(block)} cycles=(\d+)'
        elif m.group(4) is not None:
            block, value = f'{m.group(4)}.{m.group(5)}', m.group(6)
            extract = rf'CALIB_HPM {re.escape(m.group(4))} event={m.group(5)} count=(\d+)'
        else:
            block, value = m.group(7), m.group(8)
            extract = rf'CALIB_READ {re.escape(block)} value=(\d+)'
        test.add_bench(block, extract, f'{name} {block}', ref=int(value), tol=0, ref_type='rtl')


def testset_build(testset):
    testset.set_name('calibration')

    if testset.get_target().get_name() != 'cv32e40p_testbench':
        return

    cwd = testset.get_path()
    for ref in sorted(os.listdir(os.path.join(cwd, 'refs'))):
        # The reference is refs/<program>_<RTL configuration>.txt. The binary is built for
        # the configuration without the FPU latencies.
        name = ref[:-len('.txt')]
        program, config = re.match(r'(calib_\w+?)_((?:default|pulp)\w*)$', name).groups()
        binary = f'{program}_{re.sub(r"_[12]cyclat$", "", config)}.elf'
        test = testset.new_test(name)
        test.add_command(Shell('run', f'mkdir -p {name}'))
        test.add_command(Shell('run', f'gvrun --target {target(config)} --work-dir {name} '
                                      f'--param soc/binary={cwd}/{binary} run'))
        add_benches(test, name, os.path.join(cwd, 'refs', ref))
